<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171523"/>
      <stop offset="100%" stop-color="#0E0C15"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2845"/>
      <stop offset="50%" stop-color="#1F1C2E"/>
      <stop offset="100%" stop-color="#171523"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="256" height="256" rx="54" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="46" fill="none" stroke="#2D2845" stroke-width="2"/>

  <!-- Metal workpiece base -->
  <polygon points="48,160 128,216 208,160 128,104" fill="url(#metalGrad)" stroke="#6366F1" stroke-width="1.5"/>

  <!-- Engraved grid pattern -->
  <line x1="88" y1="132" x2="168" y2="188" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="68" y1="146" x2="148" y2="202" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="108" y1="118" x2="188" y2="174" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Laser head emitter -->
  <rect x="116" y="32" width="24" height="40" rx="4" fill="#2D2845" stroke="#6366F1" stroke-width="2"/>
  <polygon points="120,72 136,72 132,86 124,86" fill="#A855F7"/>

  <!-- Laser beam with glow -->
  <line x1="128" y1="86" x2="128" y2="160" stroke="#C084FC" stroke-width="3" filter="url(#glow)"/>
  <line x1="128" y1="86" x2="128" y2="160" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Laser contact point -->
  <circle cx="128" cy="160" r="10" fill="#C084FC" opacity="0.5" filter="url(#glow)"/>
  <circle cx="128" cy="160" r="4" fill="#ffffff"/>
</svg>
